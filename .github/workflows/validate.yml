name: Validate the store

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet jsonschema ruff

      - name: Lint the scripts
        run: ruff check scripts/

      # Schema, ids, logos and versions. No network, so it is quick and it is
      # what most pull requests need.
      - name: Check the index
        run: python scripts/validate.py --offline

      # When a pull request touches a plugin, download every bundle and verify its sha256
      # independently. That checksum is the only thing between a node and a swapped asset, so it
      # is worth the minutes; pushes that change nothing about a plugin skip it.
      - name: Did a plugin file change?
        id: changed
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$base" HEAD | grep -qE '^(index\.json|plugins/)'; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          else
            echo "yes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify every download and its checksum
        if: steps.changed.outputs.yes == 'true'
        run: python scripts/validate.py --deep
