name: Add a release

# Adds a plugin release to the store and opens the pull request for it. Everything comes out of
# the published bundle, so nobody types a checksum. Run it from the Actions tab, or from a plugin
# repo's own release workflow with:
#
#   gh workflow run add-release.yml -R ScotMesh/repeatertastic-plugins \
#     -f repo=$GITHUB_REPOSITORY -f tag=$GITHUB_REF_NAME
#
# (that needs a token with actions:write on this repo, which is why the plugin repo asks rather
# than writing here itself).

on:
  workflow_dispatch:
    inputs:
      repo:
        description: The plugin's repo, e.g. ScotMesh/repeatertastic-meshflow
        required: true
      tag:
        description: The release tag, e.g. v0.1.2
        required: true
      notes:
        description: One line for the update card
        required: false
      min_host:
        description: Oldest RepeaterTastic that can run it (kept from the last release if blank)
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet jsonschema pyyaml

      # Every input reaches the script through the environment, never through ${{ }} pasted into
      # the shell. This job holds a token that can write to this repo, and the people who trigger
      # it are exactly the ones the pull-request review exists to distrust.
      - name: Read the release into the store
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ inputs.repo }}
          TAG: ${{ inputs.tag }}
          NOTES: ${{ inputs.notes }}
          MIN_HOST: ${{ inputs.min_host }}
        run: |
          args=("$REPO" "$TAG")
          [ -n "$NOTES" ] && args+=(--notes "$NOTES")
          [ -n "$MIN_HOST" ] && args+=(--min-host "$MIN_HOST")
          python scripts/add_release.py "${args[@]}"

      # Offline here: the download just happened, so the URL is known good, and the checksum came
      # from those very bytes. The pull request's own run does the reachability check.
      - name: Check the index
        run: python scripts/validate.py --offline

      # The script writes what it read out of the bundle; these are only used for the branch and
      # the description, and come from the id the bundle itself declares rather than the input.
      - name: Name the change
        id: name
        env:
          REPO: ${{ inputs.repo }}
          TAG: ${{ inputs.tag }}
        run: |
          slug=$(printf '%s-%s' "$REPO" "$TAG" | tr -c 'A-Za-z0-9._-' '-' | cut -c1-80)
          {
            echo "slug=$slug"
            echo "repo=$REPO"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"

      - uses: peter-evans/create-pull-request@v7
        with:
          branch: add/${{ steps.name.outputs.slug }}
          title: "${{ steps.name.outputs.repo }} ${{ steps.name.outputs.tag }}"
          commit-message: "Add ${{ steps.name.outputs.repo }} ${{ steps.name.outputs.tag }}"
          body: |
            Added by **Add a release** from `${{ steps.name.outputs.repo }}` `${{ steps.name.outputs.tag }}`.

            The checksum, size, architectures, version and permissions were read out of the
            published bundle, so they cannot disagree with what nodes will download. CI downloads
            every bundle a pull request touches and verifies the checksum independently.
